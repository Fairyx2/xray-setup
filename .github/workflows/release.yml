name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests and vet
        run: |
          go test -race ./...
          go vet ./...

  build:
    name: Build linux/${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_TAG}" \
            -o "dist/my-vpn-linux-${{ matrix.arch }}" ./cmd/my-vpn
          (cd dist && sha256sum "my-vpn-linux-${{ matrix.arch }}") > "dist/my-vpn-linux-${{ matrix.arch }}.sha256"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: my-vpn-linux-${{ matrix.arch }}
          path: dist/my-vpn-linux-${{ matrix.arch }}*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: my-vpn-linux-*
          path: dist
          merge-multiple: true

      - name: Create checksums file
        working-directory: dist
        run: cat my-vpn-linux-*.sha256 > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/my-vpn-linux-amd64
            dist/my-vpn-linux-arm64
            dist/checksums.txt
